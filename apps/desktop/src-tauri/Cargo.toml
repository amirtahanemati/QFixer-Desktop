[package]
name = "qfixer-desktop"
version = "1.0.0"
description = "QFixer Desktop Native Core"
authors = ["QFixer Team"]
edition = "2021"

[lib]
name = "qfixer_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-shell = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
qfixer-contracts = { path = "../../../packages/shared-contracts" }
